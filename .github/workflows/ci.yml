# Everything that can be checked without the 22 GB NEMWeb backfill.
#
# The tests that need a populated warehouse skip themselves when Postgres is not
# reachable, so the offline suite is the same one `make test` runs on a laptop.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt -r requirements/serve.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest, offline)
        run: pytest

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dbt.txt

      # dbt has its own pinned environment (see requirements/dbt.txt). Parsing
      # compiles every model, macro and test without touching a database.
      - name: Install dbt
        run: pip install -r requirements/dbt.txt

      - name: Parse the project
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t nemfc-api:ci .
