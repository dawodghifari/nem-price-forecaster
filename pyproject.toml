[project]
name = "nem-price-forecaster"
version = "0.1.0"
description = "Forecasting price spikes on AEMO's live 5-minute dispatch feed"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:nemfc.*"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
