[project]
name = "nem-price-forecaster"
version = "0.1.0"
description = "Forecasting price spikes on AEMO's live 5-minute dispatch feed"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:nemfc.*",
    # A numpy RuntimeWarning is how the `-inf` tie-group bug announced itself,
    # and it announced itself in the middle of a real run rather than in the
    # suite. Numerical warnings are errors here for that reason: "invalid value
    # encountered" means an array holds something the arithmetic did not expect,
    # which in scoring code is a wrong number rather than a cosmetic complaint.
    "error::RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402: tests call pytest.importorskip() before importing the optional stack it
# guards, so those imports have to come after it.
"tests/*" = ["B011", "E402"]
